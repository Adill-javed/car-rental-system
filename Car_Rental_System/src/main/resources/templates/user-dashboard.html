<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - AutoRent</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/user-dashboard.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-inner">
                <div class="navbar-left">
                    <span class="navbar-brand text-transparent-gradient">AutoRent</span>
                    <a href="/user/dashboard" class="nav-link active">Browse Cars</a>
                    <a href="/user/myrequests" class="nav-link">My Rentals</a>
                </div>
                <div class="navbar-right">
                    <span class="welcome-text">Welcome, <span th:text="${session.loggedInUser.name}">User</span></span>
                    <a href="/logout" class="nav-link danger">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <div class="hero-section">
        <div class="navbar-container">
            <h1 class="hero-title">Find your perfect ride</h1>
            <p class="hero-subtitle">Explore our fleet of premium cars and book your next adventure today.</p>
        </div>
    </div>

    <!-- Main Content -->
    <div class="dashboard-container">
        
        <!-- Car Grid -->
        <div class="car-grid">
            <div th:each="car : ${@carService.getAllCars()}" class="car-card">
                <div class="car-image-container">
                    <img th:src="${car.image}" alt="Car Image" class="car-image">
                    <div class="image-overlay"></div>
                </div>
                <div class="car-details">
                    <div>
                        <div class="car-brand" th:text="${car.brand}">Brand</div>
                        <h2 class="car-name" th:text="${car.name}">Car Name</h2>
                        <div class="car-price">$<span th:text="${car.price}"></span><span> / day</span></div>
                    </div>
                    
                    <form action="/user/request" method="post">
                        <input type="hidden" name="carId" th:value="${car.id}">
                        <div class="booking-form">
                            <input type="number" name="days" placeholder="Days" required min="1" max="30" class="booking-input">
                            <button type="submit" class="btn-book">
                                Book Now
                            </button>
                        </div>
                    </form>
                </div>
            </div>
            
            <!-- Empty State if no cars -->
            <div th:if="${#lists.isEmpty(@carService.getAllCars())}" class="empty-state">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <h3 class="empty-state-title">No cars available</h3>
                <p class="empty-state-text">Check back later for new inventory.</p>
            </div>
        </div>

    </div>

</body>
</html>

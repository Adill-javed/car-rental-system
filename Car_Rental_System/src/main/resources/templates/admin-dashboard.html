<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - AutoRent</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/admin-dashboard.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-inner">
                <div class="navbar-left">
                    <span class="navbar-brand text-transparent-gradient">AutoRent Admin</span>
                    <a href="/admin/dashboard" class="nav-link active">Dashboard</a>
                    <a href="/admin/requests" class="nav-link">Manage Requests</a>
                </div>
                <div>
                    <a href="/logout" class="nav-link danger">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="dashboard-container">
        
        <div class="dashboard-header">
            <h1 class="dashboard-title">Car Fleet Management</h1>
            <a href="/admin/addcar" class="btn-add">
                + Add New Car
            </a>
        </div>

        <!-- Car Grid -->
        <div class="car-grid">
            <div th:each="car : ${@carService.getAllCars()}" class="car-card">
                <div class="car-image-container">
                    <img th:src="${car.image}" alt="Car Image" class="car-image">
                </div>
                <div class="car-details">
                    <div>
                        <div class="car-brand" th:text="${car.brand}">Brand</div>
                        <h2 class="car-name" th:text="${car.name}">Car Name</h2>
                        <div class="car-price">$<span th:text="${car.price}"></span> <span>/ day</span></div>
                    </div>
                    <form th:action="@{/admin/deletecar/{id}(id=${car.id})}" method="post" onsubmit="return confirm('Are you sure you want to delete this car?');">
                        <button type="submit" class="btn-delete">
                            Delete Car
                        </button>
                    </form>
                </div>
            </div>
            
            <!-- Empty State if no cars -->
            <div th:if="${#lists.isEmpty(@carService.getAllCars())}" class="empty-state">
                <p class="empty-state-text">No cars found in the inventory.</p>
                <a href="/admin/addcar" class="empty-state-link">Add your first car</a>
            </div>
        </div>

    </div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Car - AutoRent Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/add-car.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-inner">
                <div class="navbar-left">
                    <span class="navbar-brand text-transparent-gradient">AutoRent Admin</span>
                    <a href="/admin/dashboard" class="nav-link">Dashboard</a>
                    <a href="/admin/requests" class="nav-link">Manage Requests</a>
                </div>
                <div>
                    <a href="/logout" class="nav-link danger">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="add-car-container">
        
        <div class="form-card">
            <div class="form-header">
                <h1 class="form-title">Add New Car</h1>
                <p class="form-subtitle">Fill in the details below to add a car to the fleet.</p>
            </div>
            
            <form th:action="@{/admin/savecar}" method="post" class="car-form">
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="brand">Brand</label>
                        <input type="text" id="brand" name="brand" required placeholder="e.g. Toyota">
                    </div>

                    <div class="form-group">
                        <label for="name">Model Name</label>
                        <input type="text" id="name" name="name" required placeholder="e.g. Camry">
                    </div>
                </div>

                <div class="form-group">
                    <label for="price">Price Per Day ($)</label>
                    <input type="number" step="0.01" id="price" name="price" required placeholder="e.g. 50.00">
                </div>

                <div class="form-group">
                    <label for="image">Image URL</label>
                    <input type="url" id="image" name="image" required placeholder="https://example.com/car-image.jpg">
                    <p class="form-help-text">Provide a high quality, landscape image URL for best results.</p>
                </div>

                <div class="form-actions">
                    <a href="/admin/dashboard" class="btn-cancel">
                        Cancel
                    </a>
                    <button type="submit" class="btn-save">
                        Save Car
                    </button>
                </div>
            </form>
        </div>

    </div>

</body>
</html>
